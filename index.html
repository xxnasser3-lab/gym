<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Planner</title>
<meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm phone column. Plan (calendar) is home; a workout opens full screen without tabs. One orange accent on warm paper. */
:root {
  --bg: #FBF8F3;
  --surface: #FFFFFF;
  --ink: #2B2A27;
  --muted: #766F63;
  --line: #EDE7DC;
  --field: #F4EFE6;
  --accent: #D4572F;
  --on-accent: #FFFFFF;
  --soft: #FCE9E0;
  --soft-ink: #A8421F;
  --good: #3F7D4E;
  --bad: #B3261E;
  --shadow: 0 1px 2px rgba(60,50,30,.05), 0 8px 24px rgba(60,50,30,.06);
  --f: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171512; --surface: #211E1A; --ink: #F2EEE6; --muted: #A59E91; --line: #332E27; --field: #2A2621;
    --accent: #F08A63; --on-accent: #1A0F0A; --soft: #3A2418; --soft-ink: #F4A98A; --good: #7FC08F; --bad: #F07A72;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171512; --surface: #211E1A; --ink: #F2EEE6; --muted: #A59E91; --line: #332E27; --field: #2A2621;
  --accent: #F08A63; --on-accent: #1A0F0A; --soft: #3A2418; --soft-ink: #F4A98A; --good: #7FC08F; --bad: #F07A72;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { max-width: 520px; margin-inline: auto; padding-inline: 20px; padding-block: 8px 130px; }
.num { font-variant-numeric: tabular-nums; }

h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.6px; }
.top { display: flex; align-items: baseline; justify-content: space-between; padding-top: 28px; }
.top .wk { color: var(--muted); font-size: 14px; }
.lab { margin: 26px 4px 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.sub { margin: 0; color: var(--muted); font-size: 14px; }

.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 16px -4px 0; text-align: center; }
.sd { padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 16px; color: var(--muted); }
.sd span:first-child { font-size: 12px; }
.sd b { font-size: 17px; font-weight: 600; color: var(--ink); }
.sd i { width: 6px; height: 6px; border-radius: 50%; }
.sd.today { background: var(--accent); color: var(--on-accent); }
.sd.today b { color: var(--on-accent); font-weight: 700; }
.sd.plan i { background: var(--accent); }
.sd.today i { background: var(--on-accent); }
.sd.done i { background: var(--good); }
.sd.today.done i { background: var(--on-accent); }

.hero { margin-top: 20px; padding: 22px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.hero .k { font-size: 13px; color: var(--muted); }
.hero .big { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.8px; }
.hero .t { font-size: 17px; }
.hero .why { font-size: 14px; color: var(--muted); }
.btn { appearance: none; width: 100%; min-height: 54px; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 17px; padding: 10px 16px; margin-top: 14px; }
.btn.ghost { background: var(--field); color: var(--ink); }
.btn.sm { width: auto; min-height: 44px; font-size: 15px; padding: 8px 18px; margin-top: 0; border-radius: 14px; }
.btn:disabled { opacity: .45; }
.link { appearance: none; background: none; border: 0; padding: 10px 4px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
.pickrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.pickrow button { min-height: 52px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; font-size: 18px; }
.note { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--soft); color: var(--soft-ink); font-size: 14px; line-height: 1.45; }
.note b { font-weight: 600; }
.note .link { color: inherit; padding: 4px 0; min-height: 0; display: inline; }

.rows { display: flex; flex-direction: column; }
.row { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); font-size: 16px; }
.row:last-child { border-bottom: 1px solid var(--line); }
.row .l { font-weight: 600; min-width: 0; }
.row .r { color: var(--muted); font-size: 15px; text-align: end; }
.row small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }

.card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; }
.card + .card { margin-top: 12px; }
.grp { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 4px 18px; }
.set-row { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); font-size: 16px; }
.set-row:first-child { border-top: 0; }
.set-row > span:first-child { flex: none; }
.set-row .ctl { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; min-width: 0; }
.set-row.stack { flex-direction: column; align-items: stretch; padding-block: 12px; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { appearance: none; border: 0; background: var(--field); border-radius: 12px; min-height: 44px; font-size: 15px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.dayseg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dayseg button { appearance: none; border: 0; background: var(--field); border-radius: 12px; min-height: 44px; font-size: 13px; font-weight: 500; padding: 0; }
.dayseg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.fi { min-height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--field); padding: 6px 12px; font-size: 16px; width: 110px; text-align: center; }
.fi.wide { width: 100%; text-align: start; }
.fi:focus { border-color: var(--accent); outline: none; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.field .fi { width: 100%; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* workout */
.wtop { display: flex; align-items: center; justify-content: space-between; padding-top: 28px; gap: 12px; }
.wtop h1 { font-size: 28px; }
.wtop .sub { margin-top: 2px; }
.back { appearance: none; border: 0; background: var(--field); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.cur { margin-top: 20px; padding: 20px 16px 14px; }
.cur h2 { margin: 0; font-size: 21px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
.pill { display: inline-block; margin-top: 12px; padding: 6px 12px; border-radius: 999px; background: var(--soft); color: var(--soft-ink); font-size: 14px; font-weight: 600; }
.pill.n { background: var(--field); color: var(--muted); font-weight: 500; }
.last { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.sets { margin-top: 10px; display: flex; flex-direction: column; }
.hdr, .st { display: grid; grid-template-columns: 24px minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; text-align: center; }
.hdr { font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.st { min-height: 60px; border-radius: 14px; }
.st.done { background: var(--soft); }
.st .sn { font-weight: 600; color: var(--muted); }
.st input { width: 100%; height: 46px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); text-align: center; font-weight: 700; font-size: 19px; padding: 0 6px; }
.st.done input { border-color: transparent; background: transparent; }
.st input:focus { border-color: var(--accent); outline: none; }
.st input::placeholder { color: var(--muted); opacity: .6; font-weight: 600; }
.chk { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; padding: 0; }
.chk svg { width: 20px; height: 20px; }
.st.done .chk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mini { appearance: none; background: none; border: 0; padding: 10px 6px; min-height: 44px; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.mini:disabled { opacity: .35; }
.cur-f { display: flex; gap: 8px; margin-top: 4px; }
details { margin-top: 6px; font-size: 14px; }
summary { color: var(--muted); font-size: 14px; padding-block: 10px; cursor: pointer; }
details p { margin: 0 0 8px; }
.nx { appearance: none; width: 100%; min-height: 56px; border: 0; border-top: 1px solid var(--line); background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: start; padding: 0; font-size: 16px; font-weight: 600; }
.nx span:last-child { color: var(--muted); font-weight: 400; font-size: 14px; flex: none; }
.nx.dn span:first-child { color: var(--muted); font-weight: 500; text-decoration: line-through; text-decoration-color: var(--line); }
.opt { font-weight: 400; color: var(--muted); font-size: 13px; }
.restwrap { position: fixed; inset-inline: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; padding-inline: 20px; pointer-events: none; z-index: 5; }
.restbar { pointer-events: auto; width: 100%; max-width: 480px; min-height: 62px; border-radius: 20px; background: #2B2A27; color: #FFFFFF; padding: 8px 10px 8px 22px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 28px rgba(0,0,0,.25); }
.restbar .tm { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.restbar .lb { font-size: 14px; opacity: .7; margin-inline-end: 10px; }
.restbar button { appearance: none; border: 0; background: rgba(255,255,255,.14); color: #fff; border-radius: 14px; min-height: 44px; padding: 0 16px; font-size: 14px; font-weight: 600; margin-inline-start: 6px; }
.restbar.over { background: var(--accent); color: var(--on-accent); }
.restbar.over button { background: rgba(0,0,0,.14); color: var(--on-accent); }
.st input.need { border-color: var(--bad); }
.watch { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; margin-top: 12px; border-radius: 14px; background: var(--field); color: var(--ink); font-size: 15px; font-weight: 600; text-decoration: none; }
.how { margin-top: 6px; font-size: 14px; }
.how ol { margin: 0 0 8px; padding-inline-start: 20px; }
.how li { margin-bottom: 6px; }
.how .cue { margin: 0 0 8px; font-weight: 600; }
.ex { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 16px 12px 6px; margin-top: 14px; scroll-margin-top: 12px; }
.ex.dn { opacity: .72; }
.exh { display: flex; align-items: center; gap: 12px; }
.exm { min-width: 0; flex: 1; }
.exh h2 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
.cnt { color: var(--muted); font-size: 14px; flex: none; }
.tile { flex: none; width: 54px; height: 54px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; display: block; }
.tile svg { display: block; }
.prv { font-size: 13px; color: var(--muted); }
.rl { display: flex; align-items: center; gap: 10px; height: 22px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.rl i { flex: 1; height: 2px; border-radius: 2px; background: var(--line); }
.rl.on { color: var(--accent); font-weight: 700; }
.rl.on i { background: var(--accent); }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 4px; }
.photos figure { margin: 0; }
.photos img { width: 100%; height: auto; display: block; border-radius: 12px; background: var(--field); aspect-ratio: 3 / 2; object-fit: cover; }
.photos figcaption { text-align: center; font-size: 12px; color: var(--muted); padding-top: 4px; }
.figwrap { display: flex; justify-content: center; margin: 8px 0 4px; }
.mus { margin: 0 0 4px; text-align: center; font-size: 14px; color: var(--muted); }
.mus b { color: var(--ink); font-weight: 600; }
.skipd { margin-top: 18px; }
.skipd > summary { font-size: 14px; }
.pvl { display: flex; flex-direction: column; }
.pv { display: flex; align-items: center; gap: 12px; min-height: 70px; padding-block: 8px; border-top: 1px solid var(--line); }
.pv:last-child { border-bottom: 1px solid var(--line); }
.pvm { min-width: 0; flex: 1; }
.pvm b { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.pvm small { display: block; color: var(--muted); font-size: 13px; }
.pv > .num { color: var(--muted); font-size: 14px; flex: none; }

/* progress / food */
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.kv > div { background: var(--field); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.kv span { display: block; font-size: 12px; color: var(--muted); }
.kv strong { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv small { font-size: 12px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 500 10px var(--f); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .raw { fill: var(--muted); }
.chart .rawl { stroke: var(--muted); stroke-opacity: .45; stroke-width: 1; fill: none; }
.chart .ma { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .end { fill: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 6px; }
.kcal { font-size: 52px; line-height: 1; font-weight: 800; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
.mac { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.mac .t { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
.mac .t b { font-size: 24px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 999px; background: var(--field); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 999px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: start; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 0; }
.tbl td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tbl-wrap { overflow-x: auto; }
.del { appearance: none; background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 10px 4px; min-height: 44px; }
.del.sure { color: var(--bad); font-weight: 700; }
.sum { margin-top: 20px; border: 2px solid var(--accent); }
.sum h3 { margin: 0; font-size: 20px; }
pre.out { white-space: pre-wrap; word-break: break-all; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--field); border-radius: 12px; padding: 10px; max-height: 180px; overflow: auto; }

nav.tabs { position: fixed; inset-inline: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
.tabs-in { max-width: 520px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tab { appearance: none; background: none; border: 0; min-height: 62px; font-size: 13px; font-weight: 500; color: var(--muted); }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }
.toast { position: fixed; inset-inline: 20px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 420px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: 14px; text-align: center; z-index: 8; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  html { scroll-behavior: smooth; }
}
</style>

<div id="app"><main id="view"></main></div>
<div class="restwrap"><div class="restbar" id="rest" hidden></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<nav class="tabs" id="tabs" aria-label="Main">
  <div class="tabs-in">
    <button class="tab" type="button" data-act="tab" data-tab="plan">Plan</button>
    <button class="tab" type="button" data-act="tab" data-tab="prog">Progress</button>
    <button class="tab" type="button" data-act="tab" data-tab="food">Food</button>
    <button class="tab" type="button" data-act="tab" data-tab="set">Settings</button>
  </div>
</nav>

<script>

  function rebuild() { return todayISO() <= S.rebuildUntil; }
  function setsFor(ex) { return ex.full && !rebuild() ? ex.full : ex.sets; }
  function wdType(w) { return S.set.off.indexOf(w) >= 0 ? 'off' : (S.set.shift === 'early' ? 'after' : 'before'); }
  function timeFor(w) { var t = wdType(w); return t === 'off' ? S.set.tOff : t === 'after' ? S.set.tAfter : S.set.tBefore; }
  function whyFor(w) {
    var t = wdType(w);
    if (t === 'off') return 'Day off, so the morning is yours.';
    if (t === 'after') return 'Your shift ends at 6, so evening works best.';
    return 'You start at 1, so train before work.';
  }
  function pattern() {
    var k = S.set.perWeek, best = null, bestScore = -1e9;
    for (var m = 0; m < 128; m++) {
      var days = [], i;
      for (i = 0; i < 7; i++) if (m & (1 << i)) days.push(i);
      if (days.length !== k) continue;
      var has = function (x) { return (m & (1 << ((x + 7) % 7))) !== 0; };
      var bad = false, adj = 0, off = 0;
      for (i = 0; i < 7; i++) {
        if (has(i) && has(i + 1) && has(i + 2)) bad = true;
        if (has(i) && has(i + 1)) adj++;
        if (has(i) && S.set.off.indexOf(i) >= 0) off++;
      }
      if (bad) continue;
      var score = off * 3 - adj * 2;
      if (score > bestScore) { bestScore = score; best = days; }
    }
    return best || [1, 3, 5, 6];
  }
  function nextIdx() {
    var s = sortedSessions();
    return s.length ? (DAYS.indexOf(s[s.length - 1].y) + 1) % 4 : 0;
  }
  function plan(n) {
    var pat = pattern(), today = todayISO(), out = [], planned = {}, hist = {};
    var ss = sortedSessions(), idx = nextIdx();
    ss.forEach(function (s) { hist[s.d] = s; });
    for (var i = 0; i < n; i++) {
      var d = addDays(today, i), w = dow(d);
      if (i === 0 && hist[d]) { out.push({ d: d, w: w, done: true, letter: hist[d].y }); continue; }
      if (pat.indexOf(w) < 0) continue;
      var p1 = addDays(d, -1), p2 = addDays(d, -2);
      if ((hist[p1] || planned[p1]) && (hist[p2] || planned[p2])) continue;

  function weekNo() { return Math.max(1, Math.floor(dayDiff(S.startDate, todayISO()) / 7) + 1); }

  /* ---------- progression ---------- */
  /* Weights belong to a gym: history is read only from the gym in use. */
  function curGym() { return (V.run && S.draft && S.draft.g) || S.gym; }
  function gymName(id) { var g = S.gyms.filter(function (x) { return x.id === id; })[0]; return g ? g.name : 'My gym'; }
  function inGym(s, g) { return (s.g || 'g1') === g; }
  function lastOf(id) {

    for (var i = s.length - 1; i >= 0; i--) { if (inGym(s[i], g) && s[i].s && s[i].s[id] && s[i].s[id].length) return s[i].s[id]; }
    return null;
  }
  function prevOf(id) {
    var s = sortedSessions(), seen = 0, g = curGym();
    for (var i = s.length - 1; i >= 0; i--) { if (inGym(s[i], g) && s[i].s && s[i].s[id] && s[i].s[id].length) { seen++; if (seen === 2) return s[i].s[id]; } }
    return null;

  function otherGymLast(id) {
    var s = sortedSessions(), g = curGym();
    for (var i = s.length - 1; i >= 0; i--) { if (!inGym(s[i], g) && s[i].s && s[i].s[id] && s[i].s[id].length) return { name: gymName(s[i].g || 'g1'), arr: s[i].s[id] }; }

  function topW(a) { return Math.max.apply(null, a.map(function (x) { return x[0]; })); }
  function suggest(ex) {
    var last = lastOf(ex.id);

    var w = topW(last);
    var at = last.filter(function (x) { return x[0] === w; });
    var allHi = at.every(function (x) { return x[1] >= ex.hi; }) && at.length >= Math.min(2, ex.sets);
    var allLo = at.every(function (x) { return x[1] >= ex.lo; });

      return { type: 'comeback', w: Number(cw.toFixed(2)), reps: ex.lo };

    if (allHi) return { type: 'up', w: Number((w + ex.inc).toFixed(2)), reps: ex.lo };
    if (allLo) return { type: 'hold', w: w, reps: Math.min(ex.hi, Math.min.apply(null, at.map(function (x) { return x[1]; })) + 1) };
    var prev = prevOf(ex.id);

  /* ---------- body + food ---------- */

  function weightRate() {
    var E = S.weights.filter(function (e) { return dayDiff(e.d, todayISO()) <= 28; });
    if (E.length < 5) return null;
    var x0 = E[0].d;
    if (dayDiff(x0, E[E.length - 1].d) < 10) return null;
    var xs = E.map(function (e) { return dayDiff(x0, e.d); }), ys = E.map(function (e) { return e.kg; });
    var n = xs.length, mx = xs.reduce(function (a, b) { return a + b; }, 0) / n, my = ys.reduce(function (a, b) { return a + b; }, 0) / n;
    var nu = 0, de = 0;
    for (var i = 0; i < n; i++) { nu += (xs[i] - mx) * (ys[i] - my); de += (xs[i] - mx) * (xs[i] - mx); }
    return de ? (nu / de) * 7 : null;
  }
  function nutCalc() {
    var p = S.prof, w = latestBW() != null ? (movingAvg().slice(-1)[0]) : p.w, g = GOALS[p.goal];
    w = Math.round(w * 10) / 10;
    var maint = Math.round(((10 * w + 6.25 * p.h - 5 * p.a + 5) * 1.45) / 10) * 10;
    var rate = weightRate(), adj = 0;
    if (rate != null) {

  function weightChart() {

    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    var step = [0.5, 1, 2, 5].filter(function (s) { return (hi - lo) / s <= 4; })[0] || 5;
    var yMin = Math.floor((lo - 0.2) / step) * step, yMax = Math.ceil((hi + 0.2) / step) * step;
    var span = Math.max(1, dayDiff(E[0].d, E[E.length - 1].d));
    function X(e) { return L + (W - L - R) * dayDiff(E[0].d, e.d) / span; }
    function Y(v) { return T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin)); }
    var g = '', t;
    for (t = yMin; t <= yMax + 1e-9; t += step) g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (Y(t) + 3).toFixed(1) + '" text-anchor="end">' + fmt(t) + '</text>';
    var rawPts = E.map(function (e) { return X(e).toFixed(1) + ',' + Y(e.kg).toFixed(1); });
    var maPts = E.map(function (e, i) { return X(e).toFixed(1) + ',' + Y(ma[i]).toFixed(1); });
    var dots = E.map(function (e) { return '<circle class="raw" cx="' + X(e).toFixed(1) + '" cy="' + Y(e.kg).toFixed(1) + '" r="2.6"/>'; }).join('');
    var lastE = E[E.length - 1];
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weight chart">' + g +

      '<polyline class="ma" points="' + maPts.join(' ') + '"/>' +

      '<text x="' + L + '" y="' + (H - 6) + '" text-anchor="start">' + shortDate(E[0].d).slice(4) + '</text>' +
      '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + shortDate(lastE.d).slice(4) + '</text></svg>' +

    out += '<div class="lab">Body</div><div class="grp">' +
      '<label class="set-row" for="p-goal"><span>Goal</span><select id="p-goal" class="fi" style="width:auto;max-width:210px">' + Object.keys(GOALS).map(function (k) { return '<option value="' + k + '"' + (k === p.goal ? ' selected' : '') + '>' + GOALS[k].label + '</option>'; }).join('') + '</select></label>' +
      '<label class="set-row" for="p-w"><span>Starting weight (kg)</span><input id="p-w" class="fi" inputmode="decimal" value="' + fmt(p.w) + '"></label>' +
      '<label class="set-row" for="p-h"><span>Height (cm)</span><input id="p-h" class="fi" inputmode="numeric" value="' + p.h + '"></label>' +
      '<label class="set-row" for="p-a"><span>Age</span><input id="p-a" class="fi" inputmode="numeric" value="' + p.a + '"></label></div>';
    out += '<div class="lab">Data</div><div class="grp">' +
      '<div class="set-row"><span>Add workouts to my calendar</span><button class="btn sm ghost" type="button" data-act="ics">Create file</button></div>' +
      '<div class="set-row"><span>Backup my data</span><button class="btn sm ghost" type="button" data-act="exp">Create backup</button></div>' +
      '<div class="set-row stack"><label class="field" for="imp">Restore from a backup<textarea id="imp" class="fi wide" rows="3" placeholder="Paste backup text here" style="min-height:76px;text-align:start"></textarea></label><button class="btn sm ghost" type="button" data-act="imp" style="align-self:flex-start">Restore</button></div>' +
      '<div class="set-row"><span>Reset everything</span>' + delBtn('reset', 'reset') + '</div></div>';
    if (V.ics) out += '<p class="sub" style="margin:10px 4px 6px">Open the saved file on your phone to add the next 4 weeks. Make a new one when your shift changes.</p><pre class="out" id="ics-out">' + esc(V.ics) + '</pre>';
    if (V.exp) out += '<p class="sub" style="margin:10px 4px 6px">Backup text. Copy it somewhere safe.</p><pre class="out" id="exp-out">' + esc(V.exp) + '</pre>';
    return out;
  }

  /* ---------- render ---------- */
  function applyTheme() {
    var t = S.theme === 'dark' || S.theme === 'auto' ? S.theme : 'light', r = document.documentElement;
    if (t === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
  }
  function render() {
    applyTheme();
    var v = $('#view');
    var html = V.run ? renderWork() : V.tab === 'plan' ? renderPlan() : V.tab === 'prog' ? renderProg() : V.tab === 'food' ? renderFood() : renderSet();
    var keep = window.scrollY;
    v.innerHTML = html;
    $('#tabs').hidden = V.run;
    document.querySelectorAll('.tab').forEach(function (b) { if (b.dataset.tab === V.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (V.run) { startClock(); } else { stopClock(); }
    paintRest();
    if (V.scrollTo) {
      var tg = $('#ex-' + V.scrollTo);
      if (tg) tg.scrollIntoView({ behavior: 'smooth', block: 'start' });
      V.scrollTo = null;
    }
    if (V.keepScroll) { window.scrollTo({ top: keep, behavior: 'instant' }); V.keepScroll = false; }
  }
  function startClock() {
    if (timers.clock) return;
    timers.clock = setInterval(function () { var e = $('#eltime'); if (e) e.textContent = elapsed(); }, 1000);
  }
  function stopClock() { clearInterval(timers.clock); timers.clock = null; }

  /* rest timer */
  function startRest(sec, id) {
    V.rest = { end: Date.now() + sec * 1000, id: id || null };
    clearInterval(timers.rest);
    timers.rest = setInterval(paintRest, 500);
    paintRest();
  }
  function stopRest() { V.rest = null; clearInterval(timers.rest); timers.rest = null; paintRest(); }
  function paintRest() {
    var el = $('#rest');
    document.querySelectorAll('.rl').forEach(function (r) { r.classList.remove('on'); var sp = r.querySelector('span'); if (sp) sp.textContent = clock(+r.dataset.sec); });
    if (!V.rest || !V.run) { el.hidden = true; return; }
    var left = Math.ceil((V.rest.end - Date.now()) / 1000);
    el.hidden = false;
    if (left <= 0 && !V.rest.fired) { V.rest.fired = true; beep(); }
    if (V.rest.id) { var a = $('#rl-' + V.rest.id); if (a) { a.classList.add('on'); a.querySelector('span').textContent = left <= 0 ? 'Go' : clock(left); } }
    el.className = 'restbar' + (left <= 0 ? ' over' : '');
    el.innerHTML = '<div><span class="lb">' + (left <= 0 ? 'Go' : 'Rest') + '</span><span class="tm">' + (left <= 0 ? '0:00' : clock(left)) + '</span></div><div><button type="button" data-act="rest-add">+30s</button><button type="button" data-act="rest-skip">' + (left <= 0 ? 'Dismiss' : 'Skip') + '</button></div>';
    if (left <= -20) stopRest();
  }

  /* ---------- actions ---------- */
  function save(rerender) { persist(); if (rerender !== false) render(); }

  function startWorkout(day) {
    if (S.draft && S.draft.day !== day && hasProgress(S.draft)) { toast('Day ' + S.draft.day + ' is still open. Finish or leave it first.'); return; }
    if (S.draft && S.draft.day !== day) S.draft = null;
    V.run = true; V.day = day; V.pick = false; V.summary = null;
    V.t0 = (S.draft && S.draft.t0) || Date.now();
    V.tired = !!(S.draft && S.draft.tired);
    var wl = workList(day);
    var first = wl.filter(function (e) { return doneCount(e) < setsFor(e); })[0];
    V.scrollTo = first && first.id !== wl[0].id ? first.id : null;
    window.scrollTo(0, 0);
    render();
  }
  function finishWorkout() {
    var d = S.draft;
    if (!d) return;
    var s = {}, sets = 0, vol = 0, prog = 0;
    Object.keys(d.s).forEach(function (id) {
      var arr = d.s[id].filter(function (x) { return x.d && num(x.w) >= 0 && num(x.r) > 0; }).map(function (x) { return [num(x.w), Math.round(num(x.r))]; });
      if (arr.length) {
        var prev = lastOf(id);
        if (prev && improved(arr, prev)) prog++;
        s[id] = arr;
        arr.forEach(function (x) { sets++; vol += x[0] * x[1]; });
      }
    });
    if (!sets) { toast('Tick at least one set first.'); return; }
    var mins = Math.max(1, Math.round((Date.now() - d.t0) / 60000));
    S.sessions.push({ i: Date.now(), d: todayISO(), y: d.day, g: d.g || S.gym, t: mins, s: s });
    S.draft = null;
    V.summary = { day: d.day, sets: sets, vol: Math.round(vol), t: mins, prog: prog };
    V.run = false; V.tab = 'plan'; stopRest();
    window.scrollTo(0, 0);
    save();
  }

  /* sound + buzz when rest ends (audio must be unlocked by a tap) */
  var actx = null;
  function unlockAudio() {
    try { if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state === 'suspended') actx.resume(); } catch (er) {}
  }
  function beep() {
    try {
      if (actx) {
        [0, 0.28].forEach(function (d) {
          var o = actx.createOscillator(), g = actx.createGain();
          o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
          var t = actx.currentTime + d; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
          o.start(t); o.stop(t + 0.24);
        });
      }
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    } catch (er) {}
  }

  function onClick(e) {
    unlockAudio();
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    var ex = b.dataset.ex ? EX[b.dataset.ex] : null;
    if (act !== 'wt-del' && act !== 'ms-del' && act !== 'ses-del' && act !== 'reset' && V.confirm) V.confirm = null;

    if (act === 'tab') { V.tab = b.dataset.tab; V.summary = null; V.ics = ''; V.exp = ''; window.scrollTo(0, 0); render(); }
    else if (act === 'pick') { V.pick = !V.pick; render(); }
    else if (act === 'start') startWorkout(b.dataset.day);
    else if (act === 'leave') { V.run = false; stopRest(); window.scrollTo(0, 0); render(); }
    else if (act === 'closesum') { V.summary = null; render(); }
    else if (act === 'finish') finishWorkout();
    else if (act === 'energy') {
      V.tired = b.dataset.v === 'tired';
      if (S.draft) S.draft.tired = V.tired;
      save();
    }
    else if (act === 'gym-add') {
      var nm = $('#g-new').value.trim();
      if (!nm) { toast('Type the gym name first.'); return; }
      var id = 'g' + Date.now();
      S.gyms.push({ id: id, name: nm.slice(0, 40) }); S.gym = id;
      toast('Now using ' + nm); V.keepScroll = true; save();
    }
    else if (act === 'rest-add') { if (V.rest) { V.rest.end = Math.max(V.rest.end, Date.now()) + 30000; paintRest(); } }
    else if (act === 'rest-skip') stopRest();
    else if (act === 'addset') { var a = touch(ex); if (a) { a.push({ w: '', r: '', d: false }); V.keepScroll = true; save(); } }
    else if (act === 'rmset') { var a2 = touch(ex); if (a2 && a2.length > 1) { a2.pop(); V.keepScroll = true; save(); } }
    else if (act === 'done') {
      var arr = touch(ex);
      if (!arr) { toast('Finish the open workout first.'); return; }
      var i = +b.dataset.i, st = arr[i];
      if (st.d) { st.d = false; V.keepScroll = true; save(); return; }
      var w0 = st.w, r0 = st.r;
      if (st.w === '' && b.dataset.pw) st.w = b.dataset.pw;
      if (st.r === '' && b.dataset.pr) st.r = b.dataset.pr;
      if (!(num(st.w) >= 0) || !(num(st.r) > 0)) {
        st.w = w0; st.r = r0;
        var bad = !(num(w0 === '' ? b.dataset.pw : w0) >= 0) ? $('#w-' + ex.id + '-' + i) : $('#r-' + ex.id + '-' + i);
        if (bad) { bad.classList.add('need'); bad.focus(); }
        toast(bad && bad.id.charAt(0) === 'w' ? 'Type the weight you lifted (kg), then tick.' : 'Type the reps you did, then tick.');
        return;
      }
      st.d = true;
      var sets = arr;
      if (i + 1 < sets.length && !sets[i + 1].d) {
        if (sets[i + 1].w === '') sets[i + 1].w = st.w;
        if (sets[i + 1].r === '') sets[i + 1].r = st.r;
      }
      startRest(ex.rest, ex.id + '-' + i);
      V.keepScroll = true;
      var allDone = sets.every(function (x) { return x.d; });
      if (allDone) {
        var P = workList(ex.day), k = P.map(function (x) { return x.id; }).indexOf(ex.id), nxt = null, n;
        if (k < 0) { P = PROGRAM[ex.day].ex; k = P.map(function (x) { return x.id; }).indexOf(ex.id); }
        for (n = 1; n <= P.length; n++) { var c = P[(k + n) % P.length]; if (doneCount(c) < setsFor(c)) { nxt = c; break; } }
        if (nxt) { V.scrollTo = nxt.id; V.keepScroll = false; toast('Next: ' + nxt.name); }
        else toast(V.tired ? 'Key lifts done. The rest is optional. Tap Finish when you are done.' : 'All sets done. Tap Finish.');
      }
      save();
    }
    else if (act === 'wt-add') {
      var kg = num($('#bw-v').value), d = $('#bw-d').value || todayISO();
      if (!(kg >= 30 && kg <= 250)) { toast('Enter your weight in kg.'); return; }
      S.weights = S.weights.filter(function (x) { return x.d !== d; }); S.weights.push({ d: d, kg: kg });
      S.weights.sort(function (x, y) { return x.d < y.d ? -1 : 1; });
      toast('Weight saved'); V.keepScroll = true; save();
    }
    else if (act === 'wt-del') { if (V.confirm === b.dataset.key) { S.weights = S.weights.filter(function (x) { return x.d !== b.dataset.d; }); V.confirm = null; V.keepScroll = true; save(); } else { V.confirm = b.dataset.key; render(); } }
    else if (act === 'ms-add') {
      var rec = { d: todayISO() }, any = false;
      MEASURES.forEach(function (m) { var v = num($('#m-' + m[0]).value); if (v > 0) { rec[m[0]] = v; any = true; } });
      if (!any) { toast('Enter at least one measurement.'); return; }
      var prev = S.measures.length ? S.measures[S.measures.length - 1] : null;
      if (prev) MEASURES.forEach(function (m) { if (rec[m[0]] == null && prev[m[0]] != null) rec[m[0]] = prev[m[0]]; });
      S.measures = S.measures.filter(function (x) { return x.d !== rec.d; }); S.measures.push(rec);
      toast('Measurements saved'); V.keepScroll = true; save();
    }
    else if (act === 'ms-del') { if (V.confirm === b.dataset.key) { S.measures = S.measures.filter(function (x) { return x.d !== b.dataset.d; }); V.confirm = null; save(); } else { V.confirm = b.dataset.key; render(); } }
    else if (act === 'ses-del') { if (V.confirm === b.dataset.key) { S.sessions = S.sessions.filter(function (x) { return String(x.i) !== b.dataset.i; }); V.confirm = null; V.keepScroll = true; save(); } else { V.confirm = b.dataset.key; render(); } }
    else if (act === 'meals') { S.prof.meals = +b.dataset.m; V.keepScroll = true; save(); }
    else if (act === 'theme') { S.theme = b.dataset.v; V.keepScroll = true; save(); }
    else if (act === 'shift') { S.set.shift = b.dataset.v; V.keepScroll = true; save(); }
    else if (act === 'perweek') { S.set.perWeek = +b.dataset.n; V.keepScroll = true; save(); }
    else if (act === 'off') {
      var di = +b.dataset.d, ix = S.set.off.indexOf(di);
      if (ix >= 0) { if (S.set.off.length <= 1) { toast('Keep at least one day off.'); return; } S.set.off.splice(ix, 1); } else S.set.off.push(di);
      S.set.off.sort(); V.keepScroll = true; save();
    }
    else if (act === 'ics') { makeICS(); }
    else if (act === 'exp') { V.exp = JSON.stringify(S); V.keepScroll = true; offer('gym-planner-backup.json', V.exp, 'application/json'); render(); }
    else if (act === 'imp') {
      var raw = $('#imp').value.trim(), o = null;
      try { o = JSON.parse(raw); } catch (er) {}
      if (!o || !Array.isArray(o.sessions) || !o.set) { toast('That does not look like a backup.'); return; }
      S = migrate(o); V.tab = 'plan'; V.ics = ''; V.exp = '';
      save(); toast('Backup restored');
    }
    else if (act === 'reset') {
      if (V.confirm === 'reset') { S = defaults(); V.confirm = null; V.tab = 'plan'; V.ics = ''; V.exp = ''; save(); toast('Everything was reset'); }
      else { V.confirm = 'reset'; render(); }
    }
  }

  function onInput(e) {
    var t = e.target;
    if (t.classList.contains('inw') || t.classList.contains('inr')) {
      var ex = EX[t.dataset.ex], arr = touch(ex);
      if (!arr) return;
      var st = arr[+t.dataset.i];
      if (t.classList.contains('inw')) st.w = t.value; else st.r = t.value;
      persist();
    }
  }
  function onChange(e) {
    var t = e.target, id = t.id;
    if (id === 't-after') S.set.tAfter = t.value || S.set.tAfter;
    else if (id === 't-before') S.set.tBefore = t.value || S.set.tBefore;
    else if (id === 't-off') S.set.tOff = t.value || S.set.tOff;
    else if (id === 'g-sel') { S.gym = t.value; persist(); render(); return; }
    else if (id === 'g-name') { var g = S.gyms.filter(function (x) { return x.id === S.gym; })[0]; var nn = t.value.trim(); if (g && nn) g.name = nn.slice(0, 40); persist(); render(); return; }
    else if (id === 'p-goal') S.prof.goal = t.value;
    else if (id === 'p-w') { var w = num(t.value); if (w >= 30 && w <= 250) S.prof.w = w; }
    else if (id === 'p-h') { var h = num(t.value); if (h >= 120 && h <= 230) S.prof.h = h; }
    else if (id === 'p-a') { var a = num(t.value); if (a >= 14 && a <= 90) S.prof.a = a; }
    else return;
    persist();
  }

  /* calendar file + downloads */
  function blobSave(name, data, type) {
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: type || 'text/plain' }));
      a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    } catch (e) {}
  }
  function offer(name, data, type) {
    var cl = window.claude;
    if (!cl || !cl.use) { blobSave(name, data, type); return; }
    cl.use('downloads').then(function (dl) {
      if (!dl) { blobSave(name, data, type); return; }
      return dl.save({ filename: name, data: data, contentType: type }).then(function () { toast('Saved ' + name); }).catch(function () {});
    }).catch(function () { blobSave(name, data, type); });
  }
  function makeICS() {
    var P = plan(28).filter(function (x) { return !x.done; });
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Gym Planner//EN', 'CALSCALE:GREGORIAN'];
    P.forEach(function (x) {
      var ds = x.d.replace(/-/g, ''), h = parseInt(x.time.slice(0, 2), 10), m = parseInt(x.time.slice(3, 5), 10);
      var end = h * 60 + m + 75, eh = Math.floor(end / 60) % 24, em = end % 60;
      L.push('BEGIN:VEVENT', 'UID:gym-' + ds + '-' + x.letter + '@gym-planner', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
        'DTSTART:' + ds + 'T' + pad(h) + pad(m) + '00', 'DTEND:' + ds + 'T' + pad(eh) + pad(em) + '00',
        'SUMMARY:Gym: Day ' + x.letter + ' (' + PROGRAM[x.letter].label + ')', 'DESCRIPTION:' + PROGRAM[x.letter].focus,
        'BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', 'DESCRIPTION:Gym in 30 minutes', 'END:VALARM', 'END:VEVENT');
    });
    L.push('END:VCALENDAR');
    V.ics = L.join('\r\n');
    V.keepScroll = true;
    offer('gym-plan.ics', V.ics, 'text/calendar');
    render();
  }

  /* ---------- boot ---------- */
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { paintRest(); var e = $('#eltime'); if (e) e.textContent = elapsed(); } });
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  (function init() {
    var ss = sortedSessions(), t = todayISO();
    if (ss.length && dayDiff(ss[ss.length - 1].d, t) > 10 && S.rebuildUntil < t) S.rebuildUntil = addDays(t, 14);
    if (S.draft && S.draft.day && hasProgress(S.draft) && dayDiff(new Date(S.draft.t0).toISOString().slice(0, 10), t) > 1) S.draft = null;
    if (S.draft && S.draft.day && hasProgress(S.draft)) { V.run = true; V.day = S.draft.day; V.tired = !!S.draft.tired; V.t0 = S.draft.t0; }
    if (!S.updatedAt) persist();
    render();
    initRemote();
  })();
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
